name: Upstream canary

# None of the four upstreams offers an API contract: gse.com.gh and bog.gov.gh are
# WordPress sites whose markup and table ids can change without warning, StatsBank
# stamps one of its filenames with a publication vintage, and IMF's filters behave
# differently from its own documentation. This is the only job that touches them —
# it runs the live integration tests CI deliberately skips, so an upstream change
# is caught here rather than by a user getting an empty result.
#
# A failure here usually means an upstream changed, not that the code is broken.
# The assertion message names the assumption that stopped holding; start there.
#
# Precedent for what that looks like: in August 2026 GSS republished MIEG as
# `mieg_px_May26.px` with an axis spelled `2026-05` instead of `2026M05`, and four
# tests here went red at once. The client now re-reads the folder listing and
# recovers on its own, but this job is still what reports the drift.

on:
  schedule:
    # 16:30 UTC Mondays and Thursdays — after the GSE session closes (Ghana is
    # UTC+0 year-round). Twice weekly keeps the footprint small while still
    # catching a breakage within a few days.
    - cron: "30 16 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-canary
  cancel-in-progress: false

jobs:
  live:
    name: Live scrape against all four upstreams
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `test:live` sets both GSE_LIVE and BOG_LIVE. Until this was fixed the job
      # set only the former, so bog.gov.gh's 18 live tests skipped on every run and
      # the canary silently guarded three sources while claiming four.
      - name: Live integration tests
        run: npm run test:live
