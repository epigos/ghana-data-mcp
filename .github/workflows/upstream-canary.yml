name: Upstream canary

# None of these upstreams offers an API contract: gse.com.gh is a WordPress site
# whose markup and table ids can change without warning, StatsBank stamps one of
# its filenames with a publication vintage, and IMF's filters behave differently
# from its own documentation. This is the only job that touches them — it runs the
# live integration tests CI deliberately skips, so an upstream change is caught
# here rather than by a user getting an empty result.
#
# A failure here usually means an upstream changed, not that the code is broken.
# The assertion message names the assumption that stopped holding; start there.
#
# Precedent for what that looks like: in August 2026 GSS republished MIEG as
# `mieg_px_May26.px` with an axis spelled `2026-05` instead of `2026M05`, and four
# tests here went red at once. The client now re-reads the folder listing and
# recovers on its own, but this job is still what reports the drift.

on:
  schedule:
    # 16:30 UTC Mondays and Thursdays — after the GSE session closes (Ghana is
    # UTC+0 year-round). Twice weekly keeps the footprint small while still
    # catching a breakage within a few days.
    - cron: "30 16 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-canary
  cancel-in-progress: false

jobs:
  live:
    name: Live scrape against GSE, GSS and IMF
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Covers GSE, GSS and IMF. bog.gov.gh is deliberately excluded: it serves an
      # incomplete certificate chain, so verifying it needs NODE_EXTRA_CA_CERTS
      # pointed at the missing intermediate — a per-machine step a runner does not
      # have. Enabling it here fails all 18 of its tests with "could not be reached"
      # and leaves the canary permanently red over a defect on BoG's server.
      # Run those locally with `npm run test:live:bog`; the header of
      # test/integration/bog.live.test.ts has the detail.
      - name: Live integration tests
        run: npm run test:live
