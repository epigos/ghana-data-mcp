name: Deploy

# Publishing a GitHub release is the only thing that deploys. Pushing to main runs
# CI and stops there — see ci.yml. That makes the release tag the record of what is
# live, which is why the tag and package.json are checked against each other below
# rather than assumed to agree.
on:
  release:
    types: [published]

permissions:
  contents: read

# Two releases published back to back must not race to upload the same Worker.
# Never cancel: a half-finished deploy is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    # There is only one Worker, so deploying a pre-release would overwrite
    # production. Skipping is deliberate and shows up in the Actions UI; publish a
    # normal release when you mean to ship.
    if: ${{ !github.event.release.prerelease }}
    outputs:
      version: ${{ steps.identity.outputs.version }}
      name: ${{ steps.identity.outputs.name }}

    steps:
      # Explicit ref, not the default: this must build exactly what was tagged, not
      # whatever main has drifted to since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # First, and before `npm ci`, because it is the cheapest check and the
      # likeliest human error: tagging v0.2.0 without bumping package.json. Failing
      # here costs seconds instead of a minute of installing.
      - name: Tag must match package.json
        id: identity
        env:
          # Event data goes through env, never straight into the script body.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG#v}"   # npm version tags as vX.Y.Z; a bare X.Y.Z works too
          actual="$(jq -r .version package.json)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Release tag '$TAG' says $expected but package.json says $actual. Deploying would put a Worker live whose /health, ping tool, MCP handshake and outbound User-Agent all report $actual while the release notes claim $expected. Delete this release and its tag, run 'npm version <patch|minor|major>' on main, push with --follow-tags, and release again."
            exit 1
          fi
          echo "version=$actual" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Re-run rather than trusting main's green tick: a tag can point at a commit
      # main's CI never saw. These also carry test/meta.test.ts, which is the other
      # half of the version guard — it fails if src/meta.ts and package.json drift.
      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    # The Cloudflare token is an environment secret, not a repo secret, so it is
    # only ever injected into this job — not into upstream-canary.yml, which talks
    # to third-party sites, nor any workflow added later.
    environment:
      name: production
      url: ${{ vars.WORKER_BASE_URL }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The lockfile-pinned wrangler, not a marketplace action's own copy, so the
      # bundle that ships is built by the same binary ci.yml dry-runs.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke check the live version
        # Unset in a fork that has not wired up its own Worker URL. Skipping beats
        # failing someone else's release over this repo's hostname.
        if: ${{ vars.WORKER_BASE_URL != '' }}
        env:
          BASE_URL: ${{ vars.WORKER_BASE_URL }}
          EXPECTED: ${{ needs.verify.outputs.version }}
          EXPECTED_NAME: ${{ needs.verify.outputs.name }}
        run: |
          # Cloudflare propagates a new version across colos in seconds, not
          # instantly, so the first request after an upload can still hit the old
          # script. Asserting once would be a coin flip and would teach everyone to
          # re-run red releases. Poll instead, and exit on the first success.
          for attempt in $(seq 1 10); do
            body="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "$BASE_URL/health" || echo '{}')"
            got="$(printf '%s' "$body"  | jq -r '.version // empty' 2>/dev/null || true)"
            ok="$(printf '%s' "$body"   | jq -r '.ok      // empty' 2>/dev/null || true)"
            name="$(printf '%s' "$body" | jq -r '.server  // empty' 2>/dev/null || true)"
            # .ok proves this Worker's handler answered rather than a Cloudflare
            # error page; .server proves the token did not deploy a different script.
            if [ "$got" = "$EXPECTED" ] && [ "$ok" = "true" ] && [ "$name" = "$EXPECTED_NAME" ]; then
              echo "$BASE_URL/health reports $name $got (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: version='${got:-<none>}' ok='${ok:-<none>}' server='${name:-<none>}' — retrying in 6s"
            sleep 6
          done
          echo "::error::wrangler deploy succeeded but $BASE_URL/health still reports version '${got:-<no response>}' after ~60s (expected $EXPECTED). Something is live; it may not be this release. Inspect with 'npx wrangler versions list' and roll back with 'npx wrangler rollback'."
          exit 1
